name: Verificar

on:
  push:
  pull_request:

jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compilar o servidor
        run: python3 -m py_compile server.py
      - name: Conferir a ajuda
        run: python3 server.py --help
